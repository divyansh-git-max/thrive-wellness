<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thrive</title>
  <meta name="description" content="Your personal health & wellness companion: movement, posture, nutrition, sleep and mind.">
  <meta name="theme-color" content="#F6F5F1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Thrive">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply saved layout + theme before first paint to avoid a flash. Web view is always light.
    try {
      var s = JSON.parse(localStorage.getItem('thrive.v1') || '{}').settings || {};
      var l = s.layout || 'auto'; var web = l === 'web' || (l === 'auto' && window.innerWidth >= 1000);
      document.documentElement.setAttribute('data-layout', web ? 'web' : 'mobile');
      var t = web ? 'light' : s.theme;
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <main id="main" aria-live="polite"></main>
  <nav id="nav" aria-label="Main"></nav>
  <noscript><p style="padding:24px">Thrive needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
